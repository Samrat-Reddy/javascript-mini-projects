<!DOCTYPE html>
<html lang="en">
    <head>
    <title>User Directory Explorer</title>
    <meta charset="UTF-8">
    </head>

    <body>

        <h1>User Directory Explorer</h1>

        <button onclick="startApp()">Load Users</button>

        <br><br>

        <input id="searchInput" placeholder="Search User Name">
        <button onclick="searchUser()">Search</button>

        <h3 id="status"></h3>

        <div id="result"></div>

        <script>

            let users = [];

            function loadData(callback) {
                setTimeout(() => {
                    callback();
                }, 1000);
            }

            function verifyUser() {
                return new Promise((resolve) => {
                    setTimeout(() => {
                        resolve("User verified");
                    }, 2000);
                });
            }

            async function fetchUsers() {

                try {

                    document.getElementById("status").innerText =
                        "Loading users...";

                    const response = await fetch(
                        "https://jsonplaceholder.typicode.com/users"
                    );

                    if (!response.ok) {
                        throw new Error("Request Failed");
                    }

                    users = await response.json();

                    document.getElementById("status").innerText =
                        "Users loaded.";

                    displayUsers(users);

                } catch (error) {

                    document.getElementById("status").innerText =
                        "Unable to fetch users.";

                    console.log(error);

                }

            }

            function displayUsers(userList) {

                let html = "";

                userList.forEach((user) => {

                    html += `
                        <hr>

                        <p>
                            <strong>Name:</strong> ${user.name}
                        </p>

                        <p>
                            <strong>Email:</strong> ${user.email}
                        </p>

                        <p>
                            <strong>Phone:</strong> ${user.phone}
                        </p>

                        <p>
                            <strong>Company:</strong> ${user.company.name}
                        </p>
                    `;

                });

                document.getElementById("result").innerHTML = html;

            }

            function searchUser() {

                const searchText =
                    document.getElementById("searchInput")
                    .value
                    .toLowerCase();

                const filteredUsers = users.filter((user) =>
                    user.name.toLowerCase().includes(searchText)
                );

                displayUsers(filteredUsers);

            }

            function startApp() {

                loadData(async () => {

                    console.log("Callback completed");

                    const message = await verifyUser();

                    console.log(message);

                    await fetchUsers();

                });

            }
        </script>
    </body>
</html>
